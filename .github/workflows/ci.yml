name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel runs on main: a cancelled run could kill a deploy between migrate and up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Matches the local uv that produced uv.lock and the uv_build>=0.9.18,<0.10 pin.
          version: "0.9.18"
          enable-cache: true
          working-directory: backend
      - name: Sync dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest (testcontainers, pgvector PG18)
        run: uv run pytest -q

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  deploy-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Caddyfile
        run: |
          docker run --rm -e PUBLIC_HOSTNAME=localhost -e ACME_EMAIL=ci@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Only caddy publishes ports
        run: bash deploy/check-prod-ports.sh
      - name: Shell syntax
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done

  # On pull requests images are built but never pushed.
  images:
    needs: [backend, web, deploy-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      owner: ${{ steps.vars.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compute names
        id: vars
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$REF" = "refs/heads/main" ] && { [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; }; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        if: steps.vars.outputs.push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build api (local load)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          load: true
          tags: ranker-api:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Offline model selfcheck (no network)
        run: |
          docker run --rm --network none ranker-api:ci python -m ranker.selfcheck | tee selfcheck.json
          jq -e '.ok == true and .dim == 384' selfcheck.json
      - name: Build and push api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          push: ${{ steps.vars.outputs.push == 'true' }}
          platforms: ${{ vars.PLATFORMS || 'linux/amd64' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/ranker-api:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/ranker-api:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
      - name: Build and push web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: web
          push: ${{ steps.vars.outputs.push == 'true' }}
          platforms: ${{ vars.PLATFORMS || 'linux/amd64' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/ranker-web:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/ranker-web:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # Secrets cannot be used in job-level `if:`, so expose a boolean output instead.
  gate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check deploy configuration
        id: check
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
        run: |
          if [ -n "$KEY" ] && [ -n "$HOST" ] && [ -n "$PUBLIC_HOSTNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: set DEPLOY_SSH_KEY, DEPLOY_HOST secrets and PUBLIC_HOSTNAME variable to enable CD"
          fi

  deploy:
    needs: [images, gate]
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      DUSER: ${{ secrets.DEPLOY_USER || 'deploy' }}
      PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
      IMAGE_TAG: ${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS not set; using ssh-keyscan (trust on first use, MITM-able)"
            ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts
          fi
      - name: Copy deploy files
        run: |
          scp -o BatchMode=yes deploy/compose.prod.yaml deploy/Caddyfile deploy/deploy.sh deploy/smoke.sh deploy/measure-memory.sh "$DUSER@$HOST:/srv/ranker/"
      - name: Deploy
        run: |
          ssh -o BatchMode=yes "$DUSER@$HOST" "cd /srv/ranker && chmod +x deploy.sh smoke.sh measure-memory.sh && IMAGE_TAG=$IMAGE_TAG ./deploy.sh"
      - name: Smoke test over HTTPS
        run: bash deploy/smoke.sh "$PUBLIC_HOSTNAME"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
