# Optional locally; CI is the gate.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      - id: web-prettier
        name: web prettier
        entry: bash -c 'cd web && npx prettier --check .'
        language: system
        files: ^web/.*\.(ts|tsx|js|mjs|css|json)$
        pass_filenames: false
      - id: web-eslint
        name: web eslint
        entry: bash -c 'cd web && npx eslint --max-warnings 0 .'
        language: system
        files: ^web/
        pass_filenames: false
