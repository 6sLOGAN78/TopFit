# Canonical skills taxonomy (NORM-06). Loaded by ranker/ingest/skills.py via load_config.
#
# Entry fields: canonical, category, aliases, strong_aliases, ambiguous, case_sensitive,
# context (regexes tested within +-40 chars), implies, token (search-safe token override).
# - Non-ambiguous entries implicitly match their canonical name (and "-" -> " ").
# - `aliases` of an ambiguous entry only count with a context match or inside a skills list;
#   `strong_aliases` always match (case-insensitive).
# - `case_sensitive: true` makes `aliases` match exactly.
provenance:
  - >-
    Programming-language names and common aliases follow the naming used by GitHub Linguist
    languages.yml (MIT licence, https://github.com/github-linguist/linguist). Names were
    consulted as a reference on 2026-11-22 and entered by hand; no file was bulk-copied.
  - >-
    Tool, framework and database names were cross-checked against O*NET Technology Skills and
    Hot Technologies (CC BY 4.0, https://www.onetcenter.org/license_db.html). Attribution:
    "This product includes information from the O*NET 30.x Database by the U.S. Department of
    Labor, Employment and Training Administration (USDOL/ETA). Used under the CC BY 4.0
    license." The exact O*NET release was not pinned (reference lookup only, no data import).
  - "Hand-curated additions for the Indian tech market (Spring Boot, Flutter, PySpark, Airflow, dbt, Snowflake, Kafka, cloud services), 2026-11."

