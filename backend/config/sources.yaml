    - gitlab
    - canonical
    - druva
    - turing
    - databricks
    - stripe
    - cloudflare
    - elastic
    - mongodb
    - datadog
    - airbnb
    - figma
  india_candidates:
    - groww
    - zerodha
    - swiggy
    - phonepe
    - sharechat
    - dream11
    - razorpay
    - freshworks
    - browserstack
    - postman
    - unacademy
    - rapido
    - zepto
    - urbancompany
    - coindcx
    - lenskart
    - cleartax
    - whatfix
    - chargebee
    - druva
    - uniphore
    - sprinklr
    - clevertap
    - mindtickle
    - cashfree
    - juspay
    - cred
    - meesho
    - paytm
    - zeta
    - slice
    - jupiter
    - upgrad
    - inmobi
    - sarvam
lever:
  enabled: true
  expiry_policy: absence
  absence_missed_runs: 2
  volume_guard: {ratio: 0.5, window: 5, min_history: 2}
  board_unseen_days: 7
  max_runs_per_day: 4
  min_in_scope_jobs: 5
  max_discovery_probes: 40
  request_interval_seconds: 1.0
  schedule:
    - {hour: 22, minute: 15, batch: morning}   # 03:45 IST
    - {hour: 10, minute: 15}                   # 15:45 IST
  seeds:
    - cred
    - meesho
    - paytm
    - zeta
    - mindtickle
ashby:
  enabled: true
  expiry_policy: absence
  absence_missed_runs: 2
  volume_guard: {ratio: 0.5, window: 5, min_history: 2}
  board_unseen_days: 7
  max_runs_per_day: 4
  min_in_scope_jobs: 5
  max_discovery_probes: 40
  request_interval_seconds: 1.0
  schedule:
    - {hour: 22, minute: 25, batch: morning}   # 03:55 IST
    - {hour: 10, minute: 25}                   # 15:55 IST
  seeds:
