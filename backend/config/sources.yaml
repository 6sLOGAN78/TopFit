# D-17 morning-read stagger table (UTC; IST = UTC+5:30, no DST). Every enabled source has exactly
# one `batch: morning` entry starting in 21:30-00:00 UTC (checked by the worker at start), so the
# batch finishes before ~01:00 UTC (06:30 IST). Absence-policy sources add one intraday run so a
# closed job misses 2 complete runs and leaves the same day. Plans 02-14/02-16 copy their rows.
#   source       morning UTC (IST)       intraday UTC (IST)
#   greenhouse   22:00 (03:30)           10:00 (15:30)
#   lever        22:15 (03:45)           10:15 (15:45)
#   ashby        22:25 (03:55)           10:25 (15:55)
#   internshala  22:35 (04:05)           10:35 (16:05)
#   arbeitnow    23:05 (04:35)           11:05 (16:35)
#   remoteok     23:15 (04:45)           11:15 (16:45)
#   jobicy       23:20 (04:50)           11:20 (16:50)
#   remotive     23:30 (05:00)           11:30 (17:00)
#   adzuna       23:40 (05:10)           none (ttl policy; enabled: false while ADR 0001 budget is 0)
# Sweeps (worker/scheduler.py): TTL sweep 00:30 UTC (06:00 IST); enrich backlog 01:30 UTC (07:00 IST).
#
# Expiry thresholds (plan 02-11, ING-08), read by ranker.ingest.expiry.ExpiryConfig:
#   absence_missed_runs: a full-feed job expires after missing this many COMPLETE runs of its scope
#     (2, per ING-08; the morning + intraday schedule means two runs happen within a day).
#   volume_guard: a run that fetched < ratio x median(fetched of the last `window` succeeded runs)
#     expires nothing; fewer than `min_history` succeeded runs means cold start, nothing expires.
#   ttl_days / unseen_days (capped-window feeds): expire by posted age, or by not being seen for
#     unseen_days while the source had a succeeded run in the last 48 h.
#   board_unseen_days (board sources only): a job not listed for this many days expires, but only
#     if its board answered OK in the last 48 h; jobs of a dropped board expire on drop. A failing
#     board or a guard-blocked run expires nothing.
# UTC; 05:00 IST morning read (D-17, finishes before 06:30 IST) and 17:00 IST intraday.
# Remotive terms: <= 4 fetches/day, credit + link back, no signup wall.
remotive:
  enabled: true
  expiry_policy: absence
  absence_missed_runs: 2
  volume_guard: {ratio: 0.5, window: 5, min_history: 2}
  max_runs_per_day: 4
  url: https://remotive.com/api/remote-jobs
  schedule:
    - {hour: 23, minute: 30, batch: morning}
    - {hour: 11, minute: 30}

# Adzuna (plan 02-10). Search API, date-sorted slices, TTL expiry (D-13), redirect_url link back.
# SET FROM ADR 0001: no paid plan is active (25 test calls only), so calls_per_day is 0 and the
# adapter makes no calls; enabled stays false until a plan exists. Then set calls_per_day to at
# most 0.8 x the daily quota, calls_per_month to min(monthly quota, 31 x calls_per_day), and
# flip enabled to true. Schedule is UTC: 23:40 UTC is 05:10 IST (D-17 morning batch).
adzuna:
  enabled: false
  expiry_policy: ttl
  country: in
  results_per_page: 50        # ADR: Adzuna results_per_page
  salary_period: year         # ADR: Adzuna salary period
  quota:
    calls_per_day: 0          # ADR: Adzuna calls/day budget
    calls_per_month: 0        # min(ADR monthly-derived, 31 x calls_per_day)
  min_interval_seconds: 2.5
  volume_guard: {ratio: 0.5, window: 5, min_history: 2}
  ttl_days: 45
  unseen_days: 30
  queries:
    - {name: it, category: it-jobs, sort_by: date, max_days_old: 2, max_pages: 40}
    - {name: data_ml, what_or: "data scientist machine learning analytics engineer", sort_by: date, max_days_old: 2, max_pages: 5}
  backfill: {auto: true, max_days_old: 30, max_pages: 200}
  schedule:
    - {hour: 23, minute: 40, batch: morning}

# Greenhouse / Lever / Ashby public job boards (plan 02-14, ING-13, D-14 pulled in; ADR 0001).
# Each board is its own scope, so one failing board never expires another board's jobs.
# `seeds` are generated from docs/decisions/0001-sources-spike.json (measured 2026-11-21): every
# board that answered 200 with >= 1 job. Boards discovered later live in the source_boards table.
# `india_candidates` (greenhouse section only, read for all three ATSes) are the Indian companies
# from the spike seed list that discovery probes where they are not yet known. Schedules are UTC
# (IST = UTC+5:30): D-17 morning read plus one intraday run.
greenhouse:
  enabled: true
  expiry_policy: absence
  absence_missed_runs: 2
  volume_guard: {ratio: 0.5, window: 5, min_history: 2}
  board_unseen_days: 7
  max_runs_per_day: 4
  min_in_scope_jobs: 5
  max_discovery_probes: 40
  request_interval_seconds: 1.0
